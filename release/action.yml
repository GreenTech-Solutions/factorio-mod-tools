name: Factorio mod release
description: semantic-release with the shared config (release/config.cjs) for the Factorio mod checked out in the workspace
inputs:
  github-token:
    description: Token for the GitHub release and the release commit, usually secrets.GITHUB_TOKEN
    required: true
  factorio-token:
    description: Mod portal API key with the upload permission
    required: true
runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: 12.9.1
    # no dependency cache: this job holds the release secrets
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
    - name: Install semantic-release
      shell: bash
      run: pnpm install --frozen-lockfile --dir "$GITHUB_ACTION_PATH/.."
    - name: Run semantic-release
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        FACTORIO_TOKEN: ${{ inputs.factorio-token }}
      run: '"$GITHUB_ACTION_PATH/../node_modules/.bin/semantic-release" --extends "$GITHUB_ACTION_PATH/config.cjs"'

name: Self-test

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Shellcheck
        run: shellcheck -x lua/*.sh bin/factorio-mod-check load/run.sh
      - name: Check the good mod
        uses: ./
        with:
          path: test/good-mod
      - name: Check the bad mod
        id: bad
        continue-on-error: true
        uses: ./
        with:
          path: test/bad-mod
      - name: The bad mod must fail
        if: steps.bad.outcome != 'failure'
        run: |
          echo "::error::test/bad-mod passed the check"
          exit 1
      # the bad mod fails other checks too; the list of game files, as on any runner without the game
      - name: The asset check must catch the wrong sound path
        run: |
          if python3 lua/check-assets.py test/bad-mod > assets.log; then
            echo "::error::lua/check-assets.py passed test/bad-mod"
            exit 1
          fi
          cat assets.log
          grep -q "data.lua:3: error: __base__/sound/alarm-1.ogg is not in the game files" assets.log
      - name: Check the good fork
        uses: ./
        with:
          path: test/good-mod-updated
      - name: Check the bad fork
        id: bad-fork
        continue-on-error: true
        uses: ./
        with:
          path: test/bad-mod-updated
      - name: The bad fork must fail
        if: steps.bad-fork.outcome != 'failure'
        run: |
          echo "::error::test/bad-mod-updated passed the check"
          exit 1
      - name: Unit test of migrated_storage.lua
        run: ~/.local/share/factorio-lua/5.2/bin/lua test/migrated_storage_test.lua
      - name: Log check
        run: |
          assert_log_check() {
            local expected_code="$1" expected_text="$2" output code
            shift 2
            set +e
            output="$(python3 -I load/log_check.py "$@" 2>&1)"
            code=$?
            set -e
            if [ "$code" -ne "$expected_code" ]; then
              echo "::error::Expected log check exit code $expected_code, got $code"
              printf '%s\n' "$output"
              return 1
            fi
            if [ -n "$expected_text" ] && [[ "$output" != *"$expected_text"* ]]; then
              echo "::error::Log check output did not contain: $expected_text"
              printf '%s\n' "$output"
              return 1
            fi
            if [ "$expected_code" -eq 0 ] && [ -n "$output" ]; then
              echo "::error::Passing log check printed output"
              printf '%s\n' "$output"
              return 1
            fi
            if [ "$expected_code" -ne 0 ]; then
              printf '%s\n' "$output"
            fi
          }
          assert_log_check 0 '' --log test/load-log/pass.log \
            --required 'nexus-rebalanced: [0-9]+ of [0-9]+ changes applied' --forbidden 'left as it is'
          assert_log_check 1 'forbidden in the log:' --log test/load-log/fail.log \
            --required 'nexus-rebalanced: [0-9]+ of [0-9]+ changes applied' --forbidden 'left as it is'
          assert_log_check 1 'missing in the log:' --log test/load-log/pass.log \
            --required 'required text that is not present'
          assert_log_check 2 'error: bad pattern (' --log test/load-log/pass.log --required '('

  release:
    name: release config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # loads the shared config and every plugin in it on the good mod; stops at verifyConditions without tokens
      - name: Load the release config
        working-directory: test/good-mod
        run: |
          ../../node_modules/.bin/semantic-release --dry-run --no-ci --extends "$GITHUB_WORKSPACE/release/config.cjs" 2>&1 | tee release.log || true
          for plugin in semantic-release-factorio @semantic-release/github @semantic-release/git \
            @semantic-release/commit-analyzer @semantic-release/release-notes-generator; do
            grep -q "from \"$plugin\"" release.log || { echo "::error::plugin $plugin did not load"; exit 1; }
          done
